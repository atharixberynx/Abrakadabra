<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrakadabra Fashion Shop · Moda femenina en El Salvador</title>
    <meta
      name="description"
      content="Moda femenina casual chic y de oficina, tallas S a XL, varios colores por modelo y precios accesibles. Compra en línea con envío a todo El Salvador o retiro en tienda."
    />
    <!-- %BRAND_COLOR% se reemplaza con el color de src/theme/brand.css (ver vite.config.js) -->
    <meta name="theme-color" content="%BRAND_COLOR%" />

    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />

    <!-- Open Graph: vista previa al compartir en WhatsApp, Facebook e Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Abrakadabra Fashion Shop" />
    <meta property="og:title" content="Abrakadabra Fashion Shop" />
    <meta property="og:description" content="Be fashionable, be Abrakadabra. Moda femenina de la S a la XL." />
    <!-- %SITE_URL% = VITE_SITE_URL (las redes necesitan la URL completa de la imagen) -->
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:locale" content="es_SV" />

    <!-- Las tipografías se cargan desde src/theme/brand.css; esto solo acelera la conexión -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
